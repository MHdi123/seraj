{% extends "base.html" %}
{% block title %}تیکت جدید - سِراج{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-6 md:py-8 max-w-2xl">
    <div class="flex items-center gap-3 mb-6">
        <a href="{{ url_for('support_tickets') }}" class="text-gray-400 hover:text-blue-500 transition">
            <i class="fas fa-arrow-right text-lg"></i>
        </a>
        <h1 class="text-xl md:text-2xl font-semibold text-gray-800">تیکت جدید پشتیبانی</h1>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 md:p-7">
        <form method="POST">
            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-medium mb-2">عنوان تیکت <span class="text-red-400">*</span></label>
                <input type="text" name="subject" required 
                       class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
                       placeholder="مشکل خود را خلاصه وارد کنید...">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">دسته‌بندی</label>
                    <select name="category" class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
                        <option value="general">عمومی</option>
                        <option value="technical">مشکل فنی</option>
                        <option value="account">مشکل حساب کاربری</option>
                        <option value="event">مشکل رویدادها</option>
                        <option value="payment">مشکل مالی</option>
                        <option value="other">سایر</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">اولویت</label>
                    <select name="priority" class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
                        <option value="low">کم</option>
                        <option value="medium" selected>متوسط</option>
                        <option value="high">بالا</option>
                    </select>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-medium mb-2">توضیحات مشکل <span class="text-red-400">*</span></label>
                <textarea name="message" required rows="6" 
                          class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition resize-none"
                          placeholder="مشکل خود را به طور کامل توضیح دهید..."></textarea>
            </div>

            <div class="bg-blue-50 rounded-xl p-4 mb-6 text-sm text-blue-800 border border-blue-200">
                <i class="fas fa-info-circle ml-2 text-blue-500"></i>
                پس از ثبت تیکت، تیم پشتیبانی در اسرع وقت به آن پاسخ خواهد داد.
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl transition shadow-sm">
                    <i class="fas fa-paper-plane ml-2"></i> ارسال تیکت
                </button>
                <a href="{{ url_for('support_tickets') }}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2.5 rounded-xl transition text-center">
                    انصراف
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
