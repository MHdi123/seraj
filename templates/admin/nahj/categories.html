{% extends "base.html" %}

{% block title %}مدیریت دسته‌بندی نهج‌البلاغه{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">مدیریت دسته‌بندی نهج‌البلاغه</h1>
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-right">نام</th>
                    <th class="px-4 py-3 text-right">اسلاگ</th>
                    <th class="px-4 py-3 text-right">وضعیت</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <td class="px-4 py-3">{{ cat.name }}</td>
                    <td class="px-4 py-3">{{ cat.slug }}</td>
                    <td class="px-4 py-3">
                        {% if cat.is_active %}فعال{% else %}غیرفعال{% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
